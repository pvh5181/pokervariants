# Serves PokerVariants on both production domains and their www hostnames.
# Install as /etc/nginx/sites-available/pokervariants.conf.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# $uri excludes the query string, so host keys in /ws/...?k=... never reach
# the access log.
log_format pokervariants_noquery '$remote_addr - $remote_user [$time_local] '
                                 '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                                 '"$http_referer" "$http_user_agent"';

server {
    listen 80;
    listen [::]:80;
    server_name variancepoker.live www.variancepoker.live
                variancepoker.online www.variancepoker.online;

    access_log /var/log/nginx/pokervariants.access.log pokervariants_noquery;
    error_log /var/log/nginx/pokervariants.error.log warn;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Required for the table WebSocket.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # The server sends WebSocket pings every 30s; keep the tunnel alive
        # during long idle periods.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
